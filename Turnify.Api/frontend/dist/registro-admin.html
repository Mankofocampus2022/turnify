<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Turnify | Registro de Administración</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css-registro-admin.css">
</head>
<body>
<div class="register-wrapper">
    
    <div id="lockScreen" class="register-card" style="text-align: center; padding: 40px;">
        <i class="fas fa-shield-alt fa-3x" style="color: #dc3545; margin-bottom: 20px;"></i>
        <h2>Acceso Restringido</h2>
        <p>Este enlace de registro de alto nivel no es válido o ha expirado.</p>
        <br>
        <a href="login.html" class="btn-register" style="text-decoration: none; display: inline-block;">Ir al Login</a>
    </div>

    <div id="adminCard" class="register-card" style="display: none;">
        <div class="register-header">
            <h2><i class="fas fa-user-shield"></i> Alta de Administrador</h2>
            <p>Configuración de credenciales para el equipo interno de Turnify</p>
        </div>

        <form id="formRegistroAdmin" class="form-grid">
            
            <div class="input-group full-width">
                <label><i class="fas fa-user-lock"></i> Nivel de Acceso Requerido</label>
                <select id="adminTipoRol" class="form-control">
                    <option value="ADMIN">Administrador de Operaciones (Admin)</option>
                    <option value="SUPER_ADMIN">Administrador del Sistema (Super Admin) 👑</option>
                    <option value="staff">Staff de Soporte</option>
                </select>
            </div>

            <div class="input-group full-width">
                <label><i class="fas fa-user"></i> Nombre del Administrador</label>
                <input type="text" id="adminNombre" placeholder="Ej: Super Admin Turnify" required>
            </div>

            <div class="input-group full-width">
                <label><i class="fas fa-envelope"></i> Correo corporativo</label>
                <input type="email" id="adminEmail" placeholder="admin@turnify.com" required>
            </div>

            <div class="input-group full-width">
                <label><i class="fas fa-phone"></i> Teléfono de contacto</label>
                <input type="tel" id="adminTelefono" placeholder="3001234567" required>
            </div>

            <div class="input-group">
                <label><i class="fas fa-key"></i> Contraseña Maestra</label>
                <input type="password" id="adminPassword" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label><i class="fas fa-shield-alt"></i> Confirmar Contraseña</label>
                <input type="password" id="adminConfirmPassword" placeholder="••••••••" required>
            </div>

            <div class="input-group full-width">
                <button type="submit" id="btnSubmitAdmin" class="btn-register" style="background: #28a745;">
                    <span id="btnTextAdmin">Crear Cuenta Administrativa</span>
                </button>
            </div>
        </form>

        <div style="margin-top: 40px; border-top: 2px dashed rgba(255, 255, 255, 0.15); padding-top: 35px;">
            <div class="register-header" style="margin-bottom: 25px;">
                <h2><i class="fas fa-lock-open"></i> Restablecer Clave Operativa</h2>
                <p>Cambio de credenciales exclusivo para cuentas Admin o Super Admin existentes</p>
            </div>

            <form id="formCambioPasswordAdmin" class="form-grid">
                
                <input type="hidden" id="reset-token" value="">

                <div class="input-group full-width">
                    <label><i class="fas fa-envelope"></i> Correo Electrónico del Administrador</label>
                    <input type="email" id="changeAdminEmail" placeholder="admin@turnify.com" class="form-control" required>
                </div>

                <div class="input-group full-width">
                    <label><i class="fas fa-phone"></i> Teléfono Corporativo Vinculado</label>
                    <input type="tel" id="changeAdminTelefono" placeholder="3001234567" class="form-control" required>
                </div>

                <div class="input-group">
                    <label><i class="fas fa-key"></i> Nueva Contraseña Maestra</label>
                    <input type="password" id="changeAdminNewPassword" placeholder="••••••••" class="form-control" required>
                </div>

                <div class="input-group">
                    <label><i class="fas fa-shield-alt"></i> Confirmar Nueva Contraseña</label>
                    <input type="password" id="changeAdminConfirmPassword" placeholder="••••••••" class="form-control" required>
                </div>

                <div class="input-group full-width" style="margin-top: 15px;">
                    <button type="submit" id="btnResetPasswordAdmin" class="btn-register" style="background: #0056b3;">
                        <span>Cambiar Contraseña Administrativa</span>
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>

<script src="js/registro-admin.js"></script>
</body>
</html>
