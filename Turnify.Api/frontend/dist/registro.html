<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Turnify | Crear Cuenta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css-registro.css?v=2.1">
</head>
<body>
<div class="register-wrapper">
    <div class="register-card">
        <div class="register-header">
            <div id="negocioDetected" style="display: none;">
                <span id="nombreNegocioQR">Detectando negocio...</span>
            </div>
            
            <h2>Únete a Turnify</h2>
            
            <div class="role-selector">
                <button type="button" id="btnSoyCliente" class="active" onclick="cambiarRol('CLIENTE')">Soy Cliente</button>
                <button type="button" id="btnSoyBarbero" onclick="cambiarRol('ADMINISTRADOR')">Soy Dueño de Negocio</button>
            </div>
        </div>

        <form id="formRegistroCliente" class="form-grid">
            
            <div class="input-group full-width">
                <label><i class="fas fa-user"></i> Nombre completo</label>
                <input type="text" id="regNombre" placeholder="Ej: Darwin Ocampo" required>
            </div>

            <div class="input-group full-width">
                <label><i class="fas fa-envelope"></i> Correo electrónico</label>
                <input type="email" id="regEmail" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="input-group full-width">
                <label><i class="fas fa-phone"></i> Teléfono</label>
                <input type="tel" id="regTelefono" placeholder="3001234567" required>
            </div>

            <div id="groupEspecialidad" class="input-group full-width" style="display: none;">
                <label><i class="fas fa-magic"></i> ¿Cuál es tu especialidad?</label>
                <select id="regCategoria">
                    <option value="Barbero">Barbería / Corte de Cabello 💈</option>
                    <option value="Manicurista">Manicura / Cuidado de Uñas / estética general 💅</option>
                </select>
            </div>

            <div id="groupNegocio" class="input-group full-width" style="display: none;">
                <label><i class="fas fa-store"></i> Nombre de tu Negocio / Establecimiento</label>
                <input type="text" id="regNegocio" placeholder="Ej: Barbería El Don o Salón Belleza">
            </div>

            <div id="sectionReservaInmediata" class="full-width" style="display: none;">
                <hr>
                <p><strong>Detalles de tu Cita</strong></p>
                
                <div class="input-group full-width">
                    <label><i class="fas fa-cut"></i> Servicio</label>
                    <select id="regServicio">
                        <option value="">Selecciona un servicio</option>
                    </select>
                </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label><i class="fas fa-calendar-alt"></i> Fecha</label>
                        <input type="date" id="regFecha">
                    </div>

                    <div class="input-group">
                        <label><i class="fas fa-clock"></i> Hora</label>
                        <select id="regHora">
                            <option value="">Elige fecha primero</option>
                        </select>
                    </div>
                </div>

                <div class="input-group full-width">
                    <label><i class="fas fa-hand-holding-heart"></i> Modalidad del servicio</label>
                    <select id="regModalidad" onchange="toggleDireccionRegistro()">
                        <option value="local">En el local / Establecimiento</option>
                        <option value="domicilio">A domicilio (Servicio Premium)</option>
                    </select>
                </div>

                <div id="groupDireccionRegistro" class="input-group full-width" style="display: none;">
                    <label><i class="fas fa-map-marker-alt"></i> Dirección exacta</label>
                    <input type="text" id="regDireccion" placeholder="Calle, número y barrio">
                </div>
                <hr>
            </div>

            <div class="input-group">
                <label><i class="fas fa-key"></i> Contraseña</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label><i class="fas fa-shield-alt"></i> Confirmar</label>
                <input type="password" id="regConfirmPassword" placeholder="••••••••" required>
            </div>

            <div class="input-group full-width">
                <button type="submit" id="btnSubmit" class="btn-register">
                    <span id="btnText">Registrarme como Cliente</span>
                </button>
            </div>
        </form>

        <div class="register-footer">
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </div>
</div>

<script src="js/registro-clientes.js"></script>
</body>
</html>
