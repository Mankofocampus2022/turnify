<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Turnify | Restablecer Contraseña</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="restablecer-password.css">
</head>
<body>
    <div class="reset-card">
        <div class="logo">🔒</div>
        <h2>Crea tu nueva clave</h2>
        <p>Ingresa tus datos de validación y tu nueva contraseña para acceder.</p>
        
        <form id="form-reset">
            <input type="hidden" id="reset-token">

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Correo electrónico" required autocomplete="username">
            </div>

            <div class="input-group">
                <i class="fas fa-phone"></i>
                <input type="tel" id="telefono" placeholder="Número de celular" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="new-password" placeholder="Nueva contraseña" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-update">ACTUALIZAR CONTRASEÑA</button>
        </form>

        <a href="login.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Volver al login
        </a>
    </div>

    <script src="js/restablecer-password.js"></script>
</body>
</html>
