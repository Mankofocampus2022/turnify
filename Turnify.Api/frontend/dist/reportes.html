<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Turnify | Reportes y Estadísticas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css-reportes-style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="logo-icon">🕒</span>
                <h2>Turnify</h2>
            </div>
            
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item">
                    <i class="fas fa-chart-line"></i> Resumen
                </a>
                <a href="usuarios.html" class="nav-item">
                    <i class="fas fa-users"></i> Usuarios
                </a>
                <a href="servicios.html" class="nav-item">
                    <i class="fas fa-cut"></i> Servicios
                </a>
                <a href="reportes.html" class="nav-item active">
                    <i class="fas fa-file-invoice-dollar"></i> Reportes
                </a>
                <a href="configuracion.html" class="nav-item">
                    <i class="fas fa-cog"></i> Configuración
                </a>

                <a href="#" class="nav-item" id="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </a>
            </nav>
        </aside>

        <main class="main-content" id="contenido-reporte">
            <div class="header-section">
                <h2>Reportes de Actividad</h2>
                <div class="user-info">
                    <span>Sesión: <strong id="admin-name">Administrador</strong></span>
                </div>
            </div>

            <div class="actions-bar" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;">
                <div class="filters">
                    <select id="filtro-periodo" class="btn-filter" style="background: #162431; color: #48c1b5; border: 1px solid #48c1b5; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                        <option value="hoy">Hoy</option>
                        <option value="semana">Esta Semana</option>
                        <option value="mes" selected>Este Mes</option>
                    </select>
                </div>
                <div class="export-buttons">
                    <button id="btn-excel" class="btn-export" style="background: #1d6f42; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-right: 10px; font-weight: bold;">
                        <i class="fas fa-file-excel"></i> EXCEL
                    </button>
                    <button id="btn-pdf" class="btn-export" style="background: #a52a2a; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-title">Citas Totales</span>
                    <p id="total-citas" class="stat-value">0</p>
                </div>
                
                <div class="stat-card income"> 
                    <span class="stat-title">Ingresos Totales</span>
                    <p id="total-ingresos" class="stat-value">$0</p>
                </div>

                <div class="stat-card">
                    <span class="stat-title">Nuevos Clientes</span>
                    <p id="nuevos-clientes" class="stat-value">0</p>
                </div>
            </div>

            <div class="charts-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
                <div class="table-card" style="padding: 20px;">
                    <h3 style="margin-bottom: 15px;"><i class="fas fa-chart-pie"></i> Servicios más Pedidos</h3>
                    <canvas id="chartServicios"></canvas>
                </div>
                <div class="table-card" style="padding: 20px;">
                    <h3 style="margin-bottom: 15px;"><i class="fas fa-chart-line"></i> Crecimiento de Clientes</h3>
                    <canvas id="chartClientes"></canvas>
                </div>
            </div>

            <div class="table-card"> 
                <h3 style="padding: 20px 20px 0 20px;"><i class="fas fa-list"></i> Detalle de Movimientos</h3>
                <table class="turnify-table">
                   <thead>
                        <tr>
                            <th>FECHA / HORA</th>
                            <th>CLIENTE</th>
                            <th>SERVICIO</th>
                            <th>MONTO</th>
                            <th>ESTADO</th>
                        </tr>
                    </thead>
                    <tbody id="lista-reportes">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <script src="js/reportes.js"></script>
</body>
</html>
